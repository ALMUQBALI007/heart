<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Heart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #05020a;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>

  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    function heartPosition(t) {
      return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
      };
    }
    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.t = Math.random() * Math.PI * 2;
        const pos = heartPosition(this.t);
        const scale = 12 + Math.random() * 3;
        
        this.targetX = width / 2 + pos.x * scale;
        this.targetY = height / 2 + pos.y * scale;
        
        this.x = width / 2;
        this.y = height / 2;
        
        this.size = Math.random() * 2 + 0.5;
        this.speed = Math.random() * 0.03 + 0.01;
        this.alpha = Math.random() * 0.8 + 0.2;
        this.color = `hsla(${340 + Math.random() * 30}, 100%, 55%, ${this.alpha})`;
      }

      update(beatScale) {
        const dx = (this.targetX - width / 2) * beatScale + width / 2 - this.x;
        const dy = (this.targetY - height / 2) * beatScale + height / 2 - this.y;
        
        this.x += dx * this.speed;
        this.y += dy * this.speed;
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const particles = [];
    for (let i = 0; i < 2500; i++) {
      particles.push(new Particle());
    }

    let angle = 0;

    function animate() {

      ctx.fillStyle = "rgba(5, 2, 10, 0.2)";
      ctx.fillRect(0, 0, width, height);

      angle += 0.05;
      const beatScale = 1 + Math.sin(angle) * 0.12;

      particles.forEach((p) => {
        p.update(beatScale);
        p.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
